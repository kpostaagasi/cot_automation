name: 1 - COT Rapor Hazırla
on:
  # Zamanlama cron-job.org'da: Pazartesi 09:00 İstanbul, workflow_dispatch
  # (GitHub schedule'ı bu hesapta 4-6 saat gecikiyor).
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Secret kontrolü
        env:
          PACKAGE_KEY: ${{ secrets.PACKAGE_KEY }}
        run: '[ -n "$PACKAGE_KEY" ] || { echo "PACKAGE_KEY secret tanımlı değil"; exit 1; }'
      - run: pip install -r requirements.txt
      - run: python send_weekly.py prepare
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO:   ${{ secrets.MAIL_TO }}
          MAIL_CC:   ${{ secrets.MAIL_CC }}
          # Önizleme mailindeki link: 2. workflow'un sayfası (Run workflow ile gönderim)
          RUN_URL:   ${{ github.server_url }}/${{ github.repository }}/actions/workflows/cot_2_gonder.yml
          MPLBACKEND: Agg
      # Public repoda artifact'ler herkes tarafından indirilebilir: paket şifreli yüklenir
      - name: Paketi şifrele
        env:
          PACKAGE_KEY: ${{ secrets.PACKAGE_KEY }}
        run: tar -czf - out | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:PACKAGE_KEY -out cot-paket.enc
      - uses: actions/upload-artifact@v4
        with: { name: cot-paket, path: cot-paket.enc, retention-days: 7 }
