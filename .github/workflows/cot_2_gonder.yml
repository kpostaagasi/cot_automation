name: 2 - COT Ekibe Gönder (ONAY)
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Hazırlık run id (boş bırakırsan en son başarılı hazırlık kullanılır)"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Onaylanan paketi indir
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          PACKAGE_KEY: ${{ secrets.PACKAGE_KEY }}
        run: |
          set -euo pipefail
          [ -n "$RUN_ID" ] || RUN_ID=$(gh run list -w cot_1_hazirla.yml -s success -L 1 --json databaseId -q '.[0].databaseId')
          [ -n "$RUN_ID" ] || { echo "Başarılı hazırlık run'ı bulunamadı"; exit 1; }
          echo "Gönderilecek paket run: $RUN_ID"
          gh run download "$RUN_ID" -n cot-paket -D pkg
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:PACKAGE_KEY -in pkg/cot-paket.enc | tar -xzf -
          ls -l out
      - run: python send_weekly.py send
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO:   ${{ secrets.MAIL_TO }}
          MAIL_CC:   ${{ secrets.MAIL_CC }}
