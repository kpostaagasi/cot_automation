name: CFTC COT Haftalık Rapor
on:
  schedule:
    - cron: "30 5 * * 1"   # Pazartesi 08:30 İstanbul (UTC+3)
  workflow_dispatch: {}

jobs:
  rapor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Raporu üret
        run: python send_weekly.py prepare
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO:   ${{ secrets.MAIL_TO }}
          MAIL_CC:   ${{ secrets.MAIL_CC }}
          MPLBACKEND: Agg
      - name: Ekibe gönder
        run: python send_weekly.py send
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO:   ${{ secrets.MAIL_TO }}
          MAIL_CC:   ${{ secrets.MAIL_CC }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: cot-paket, path: out/, retention-days: 7 }
